[workflow]
files = ["ci-main.yml", "ci-policy.yml", "ci-pr.yml", "ci-unit-bun.yml", "ci-unit-docker.yml", "ci-unit-rust.yml", "maintenance.yml", "nightly.yml"]
notes = ["Rust verification uses Mr. Boxington 1.12.0 on providers [github-hosted]. GitHub-hosted jobs use its GitHub cache backend with bounded snapshot keys (a key names the toolchain/image/linker compatibility class and the hashed source state, so a new source state saves a new snapshot and retention keeps generations bounded). Local-provider jobs use an explicit local-backend setup step against the image/runner-provided local store."]

[release]
enabled = false
reason = "Release is fail-closed. Enable only after declaring immutable artifact, registry, provenance, and tag-protection policy."

