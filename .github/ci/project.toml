detected = ["cargo-lockfile", "package-manager:bun:web", "package-script:web:build", "package-script:web:lint", "package-script:web:test", "package-script:web:typecheck", "rust-binaries:taskfmt-host:1", "rust-binaries:taskfmt-runtime:1", "rust-binaries:taskfmt:1", "rust-build-script:taskfmt-core", "rust-test-targets:taskfmt-harness:1", "rust-workspace-members:5"]
