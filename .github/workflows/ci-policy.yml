name: CI / Workflow Policy

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  policy:
    name: Policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout pull request workflows
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: policy-checkout
          fetch-depth: 1
          persist-credentials: false

      - name: Set up actionlint
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: actionlint@1.7.12
          cache: false

      - name: Lint pull request workflows
        working-directory: policy-checkout
        env:
          MISE_NO_CONFIG: "1"
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/actionlint.yaml"
          printf '{}\n' > "$config"
          mise exec actionlint@1.7.12 -- actionlint -config-file "$config"
