name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci-required:
    name: ci-required
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy --component rustfmt --component llvm-tools

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check all targets and features
        run: cargo check --locked --all-targets --all-features

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets --all-features

      - name: Build release binary
        run: cargo build --locked --release --bin taskfmt

      - name: Lint template and examples
        shell: bash
        run: |
          set -euo pipefail
          for task in reference/task-template examples/TASK-*; do
            target/release/taskfmt lint "$task"
          done
