schema = 2

[generator]
repository = "donbeave/task-format"
revision = "28b7e7fee86f8787c45c85bcded26d157953de4f"

[workflow]
providers = ["github-hosted"]
automatic_providers = ["github-hosted"]
default_branch = "main"
files = ["ci-pr.yml", "ci-policy.yml"]

[workflow.selectors.github-hosted]
runs_on = ["ubuntu-24.04"]

[policy]
ruleset_required_status_checks = ["ci-required", "Policy"]

[[units]]
id = "rust-taskfmt"
ci_tasks = ["taskfmt-ci"]
watch = ["Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "mise.toml", "README.md", "src/**", "tests/**", "testdata/**", "reference/**", "examples/**"]
