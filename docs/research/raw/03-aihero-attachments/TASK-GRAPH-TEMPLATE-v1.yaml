# Planner/harness-owned. Do not mount this entire graph into a one-task executor
# unless a task-specific fact cannot be compiled into the task package.
schema: task-graph/v1
initiative:
  id: INIT-000
  title: "<initiative title>"
  source:
    ref: "<spec issue/path/commit>"
    sha256: "<digest of compiled source snapshot>"
  approval:
    status: draft # draft | approved
    approved_by: null
    approved_at_utc: null
    notes: null

tasks:
  - id: TASK-001
    title: "<one independently demonstrable outcome>"
    shape: tracer-bullet
    delivers: "<end-to-end behavior or independently reviewable structural result>"
    demo_path: "<command or interaction and expected result>"
    primary_seam: "<highest stable seam>"
    supporting_seams: []
    blocked_by: []
    owns_source_ids: ["REQ-001", "REQ-002"]
    package: "tasks/TASK-001"
    expected_context: small # small | medium
    transition:
      mode: direct # direct | expand-contract
      role: null   # expand | migrate | contract
      sequence_id: null
      mandatory_contract_task: null
    author_gate:
      status: pending # pending | approved | rejected
      reviewed_by: null
      reviewed_at_utc: null

  - id: TASK-002
    title: "<next outcome>"
    shape: tracer-bullet
    delivers: "<behavior>"
    demo_path: "<proof>"
    primary_seam: "<seam>"
    supporting_seams: []
    blocked_by: ["TASK-001"]
    owns_source_ids: ["REQ-003"]
    package: "tasks/TASK-002"
    expected_context: medium
    transition:
      mode: direct
      role: null
      sequence_id: null
      mandatory_contract_task: null
    author_gate:
      status: pending
      reviewed_by: null
      reviewed_at_utc: null

# Graph invariants:
#
# 1. The graph is acyclic and every blocker ID exists.
# 2. A task is READY only when author_gate.status=approved and every blocker is
#    complete in the external task-state store.
# 3. Every task has one demo path and one primary seam.
# 4. Source-requirement ownership does not accidentally overlap; deliberate
#    shared invariants are explicitly marked and independently testable.
# 5. Every tracer-bullet task owns all layers required by its ACs.
# 6. Prefactors precede only the tasks they genuinely unblock.
# 7. An expand-contract sequence has one expand, one or more migrate tasks, and
#    exactly one mandatory contract task blocked by every migration.
# 8. Initiative completion requires every mandatory contract task.
# 9. A task package is compiled only after graph approval.
