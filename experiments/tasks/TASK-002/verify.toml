# verify.toml — declarative inputs for the gate (`taskfmt verify`). Data only.
# Paths are relative to the repository root (the working directory of the gate).
# The scope base is the per-run trusted commit: TASKFMT_BASE env, --base flag, else "baseline".

schema = "verify/v1"

# Trusted overlay files: shipped on the run base commit, never authored by the executor.
# Semantics required: "not created and not modified by this run", not "absent from the tree".
forbidden_paths = [
  "crates/pgtui/src/render.rs",
  "crates/pgtui/src/fonts",
]

required_paths = [
  "crates/pgtui/src/app.rs",
  "crates/pgtui/src/keys.rs",
  "crates/pgtui/src/runtime.rs",
  "crates/pgtui/src/store/mod.rs",
  "crates/pgtui/src/ui/mod.rs",
  "crates/pgtui/src/ui/connection_list.rs",
  "crates/pgtui/src/ui/status.rs",
]

allowed_globs = [
  "crates/pgtui/src/lib.rs",
  "crates/pgtui/src/main.rs",
  "crates/pgtui/src/app.rs",
  "crates/pgtui/src/keys.rs",
  "crates/pgtui/src/runtime.rs",
  "crates/pgtui/src/store/mod.rs",
  "crates/pgtui/src/ui/mod.rs",
  "crates/pgtui/src/ui/connection_list.rs",
  "crates/pgtui/src/ui/status.rs",
]

[focused]
commands = [
  "cargo test -p pgtui --test store_test",
  "cargo test -p pgtui --test app_connection_list_test",
  "cargo test -p pgtui --test screen_connection_list_test",
  "cargo test -p pgtui --test cli_test",
]

[regression]
commands = [
  "cargo test -p pgtui --test skeleton_test --test store_test --test app_connection_list_test --test screen_connection_list_test --test cli_test",
]

[lint]
commands = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
]

[[forbidden_patterns]]
regex = 'todo!\(|unimplemented!\('
paths = [
  "crates/pgtui/src",
]

[[forbidden_patterns]]
regex = 'dbg!\('
paths = [
  "crates/pgtui/src",
]

[[forbidden_patterns]]
regex = '#\[allow\((clippy|dead_code|unused)'
paths = [
  "crates/pgtui/src",
]

[[forbidden_patterns]]
regex = '#\[ignore\]'
paths = [
  "crates/pgtui/tests",
]

[[forbidden_patterns]]
regex = 'tokio_postgres'
paths = [
  "crates/pgtui/src",
]
