# verify.toml — declarative inputs for the gate (`taskfmt verify`). Data only.
# Paths are relative to the repository root (the working directory of the gate).
# The scope base is the per-run trusted commit: TASKFMT_BASE env, --base flag, else "baseline".

schema = "verify/v1"

# Trusted overlay files: shipped on the run base commit, never authored by the executor.
# Semantics required: "not created and not modified by this run", not "absent from the tree".
forbidden_paths = [
  "crates/pgtui/src/render.rs",
  "crates/pgtui/src/fonts",
]

required_paths = [
  "Cargo.toml",
  "Cargo.lock",
  "rust-toolchain.toml",
  "rustfmt.toml",
  ".gitignore",
  ".cargo/config.toml",
  "crates/pgtui/Cargo.toml",
  "crates/pgtui/src/lib.rs",
  "crates/pgtui/src/main.rs",
  "crates/pgtui/src/bin/gallery.rs",
]

allowed_globs = [
  "Cargo.toml",
  "Cargo.lock",
  "rust-toolchain.toml",
  "rustfmt.toml",
  ".gitignore",
  ".cargo/config.toml",
  "crates/pgtui/Cargo.toml",
  "crates/pgtui/src/lib.rs",
  "crates/pgtui/src/main.rs",
  "crates/pgtui/src/bin/gallery.rs",
]

[focused]
commands = [
  "cargo build --workspace --all-targets",
  "cargo test -p pgtui --test skeleton_test -- stub",
  "cargo test -p pgtui --test skeleton_test -- trims pipeline",
  "git diff --exit-code -- crates/pgtui/src/render.rs crates/pgtui/src/fonts",
  # D-001 pins, runtime (plain `= "x.y.z"` form): every one must be present in the workspace
  # manifest, or the run is missing a pin and would poison later tasks' base.
  "grep -qE '^ratatui = \"=0\\.30\\.2\"' Cargo.toml && grep -qE '^crossterm = \"=0\\.29\\.0\"' Cargo.toml && grep -qE '^tokio-postgres = \"=0\\.7\\.18\"' Cargo.toml",
  # D-001 pins, runtime (inline-table form: version plus the D-001 features).
  "grep -qE '^turso = \\{ version = \"=0\\.7\\.2\"' Cargo.toml && grep -qE '^tokio = \\{ version = \"=1\\.53\\.1\"' Cargo.toml && grep -qE '^clap = \\{ version = \"=4\\.6\\.6\"' Cargo.toml && grep -qE '^thiserror = \"=2\\.0\\.20\"' Cargo.toml && grep -qE '^directories = \"=6\\.0\\.0\"' Cargo.toml && grep -qE '^resvg = \"=0\\.48\\.1\"' Cargo.toml",
  # D-001 pins, dev-dependencies (testcontainers anchored so testcontainers-modules cannot satisfy it).
  "grep -qE '^tempfile = \"=3\\.27\\.0\"' Cargo.toml && grep -qE '^testcontainers = \"=0\\.27\\.3\"' Cargo.toml && grep -qE '^testcontainers-modules = \\{ version = \"=0\\.15\\.0\"' Cargo.toml && grep -qE '^nix = \\{ version = \"=0\\.30\\.1\"' Cargo.toml",
]

[regression]
commands = [
  "cargo test -p pgtui --test skeleton_test",
]

[lint]
commands = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
]

[[forbidden_patterns]]
regex = 'todo!\(|unimplemented!\('
paths = [
  "crates/pgtui/src",
]

[[forbidden_patterns]]
regex = 'dbg!\('
paths = [
  "crates/pgtui/src",
]

[[forbidden_patterns]]
regex = '#\[allow\((clippy|dead_code|unused)'
paths = [
  "crates/pgtui/src",
]

[[forbidden_patterns]]
regex = '#\[ignore\]'
paths = [
  "crates/pgtui/tests",
]
