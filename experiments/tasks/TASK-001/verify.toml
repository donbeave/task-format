schema = "verify/v2"
task_id = "TASK-001"
writable_paths = ["Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "rustfmt.toml", ".gitignore", ".cargo", "crates"]
forbidden_paths = ["crates/pgtui/src/render.rs", "crates/pgtui/src/fonts", "crates/pgtui/tests"]

[[forbidden_patterns]]
regex = 'todo!\\(|unimplemented!\\(|dbg!\\('
paths = ["crates"]

[[checks]]
id = "CHK-001"
phase = "focused"
argv = ["cargo", "build", "--workspace", "--all-targets"]
requirements = ["R-001"]
acceptance = ["AC-001"]

[[checks]]
id = "CHK-002"
phase = "focused"
shell = "grep -qE '^ratatui = \\\"=0\\\\.30\\\\.2\\\"' Cargo.toml && grep -q '1.98.0' rust-toolchain.toml && grep -q 'edition = \\\"2024\\\"' rustfmt.toml"
requirements = ["R-002", "R-003"]
acceptance = ["AC-002"]

[[checks]]
id = "CHK-003"
phase = "regression"
argv = ["cargo", "test", "-p", "pgtui", "--test", "skeleton_test"]
requirements = ["R-004", "R-005"]
acceptance = ["AC-003"]

[[checks]]
id = "CHK-004"
phase = "lint"
argv = ["cargo", "clippy", "--workspace", "--all-targets", "--", "-D", "warnings"]
requirements = ["R-006", "R-007"]
acceptance = ["AC-004"]

[[checks]]
id = "CHK-005"
phase = "gate"
argv = ["git", "diff", "--check"]
requirements = ["R-006", "R-007"]
acceptance = ["AC-005"]
