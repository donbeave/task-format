[package]
name = "taskfmt"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
description = "In-container task init, progress, lint, and verification"
license = "Apache-2.0"

[lib]
name = "taskfmt_bin"
path = "src/lib.rs"

[[bin]]
name = "taskfmt"
path = "src/main.rs"

[dependencies]
taskfmt = { package = "taskfmt-core", path = "../taskfmt-core" }
anyhow = "1"
clap = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
