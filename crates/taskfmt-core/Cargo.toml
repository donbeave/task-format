[package]
name = "taskfmt-core"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
description = "Shared taskfmt library: lint, gate, progress, parsers"
license = "Apache-2.0"

[lib]
name = "taskfmt"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
toml = "1.1.5"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
