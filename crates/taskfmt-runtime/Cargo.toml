[package]
name = "taskfmt-runtime"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
description = "In-container boot, prerequisites, and agent supervisor"
license = "Apache-2.0"

[lib]
name = "taskfmt_runtime"
path = "src/lib.rs"

[[bin]]
name = "taskfmt-runtime"
path = "src/main.rs"

[dependencies]
taskfmt = { package = "taskfmt-core", path = "../taskfmt-core" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { workspace = true }
signal-hook = "0.4.4"
serde_json = "1"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
