schema = "verify/v2"
task_id = "TASK-001"
writable_paths = ["Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "rustfmt.toml", ".gitignore", ".cargo", "crates"]
forbidden_paths = ["crates/pgtui/src/render.rs", "crates/pgtui/src/fonts", "crates/pgtui/tests"]

[[forbidden_patterns]]
regex = 'todo!\(|unimplemented!\(|dbg!\('
paths = ["crates"]

[[checks]]
id = "CHK-001"
phase = "focused"
argv = ["cargo", "build", "--workspace", "--all-targets"]
requirements = ["R-001"]
acceptance = ["AC-001"]

[[checks]]
id = "CHK-002"
phase = "focused"
shell = "grep -qE '^ratatui = \"=0\\.30\\.2\"' Cargo.toml && grep -qE '^crossterm = \"=0\\.29\\.0\"' Cargo.toml && grep -qE '^tokio-postgres = \"=0\\.7\\.18\"' Cargo.toml && grep -qE '^turso = \\{ version = \"=0\\.7\\.2\"' Cargo.toml && grep -qE '^tokio = \\{ version = \"=1\\.53\\.1\"' Cargo.toml && grep -qE '^clap = \\{ version = \"=4\\.6\\.6\"' Cargo.toml && grep -qE '^thiserror = \"=2\\.0\\.20\"' Cargo.toml && grep -qE '^directories = \"=6\\.0\\.0\"' Cargo.toml && grep -qE '^resvg = \"=0\\.48\\.1\"' Cargo.toml && grep -qE '^tempfile = \"=3\\.27\\.0\"' Cargo.toml && grep -qE '^testcontainers = \"=0\\.27\\.3\"' Cargo.toml && grep -qE '^testcontainers-modules = \\{ version = \"=0\\.15\\.0\"' Cargo.toml && grep -qE '^nix = \\{ version = \"=0\\.30\\.1\"' Cargo.toml && grep -q '1.98.0' rust-toolchain.toml && grep -q 'edition = \"2024\"' rustfmt.toml && grep -qFx 'TESTCONTAINERS_COMMAND = \"remove\"' .cargo/config.toml && grep -qFx 'target/' .gitignore && grep -qFx 'edition.workspace = true' crates/pgtui/Cargo.toml && grep -qFx 'workspace = true' crates/pgtui/Cargo.toml && grep -qFx 'name = \"pgtui\"' crates/pgtui/Cargo.toml && grep -qFx 'name = \"gallery\"' crates/pgtui/Cargo.toml"
requirements = ["R-002", "R-003"]
acceptance = ["AC-002"]

[[checks]]
id = "CHK-003"
phase = "regression"
argv = ["cargo", "test", "-p", "pgtui", "--test", "skeleton_test"]
requirements = ["R-004", "R-005"]
acceptance = ["AC-003"]

[[checks]]
id = "CHK-004"
phase = "lint"
argv = ["cargo", "clippy", "--workspace", "--all-targets", "--", "-D", "warnings"]
requirements = ["R-006", "R-007"]
acceptance = ["AC-004"]

[[checks]]
id = "CHK-005"
phase = "gate"
argv = ["git", "diff", "--check"]
requirements = ["R-006", "R-007"]
acceptance = ["AC-005"]
