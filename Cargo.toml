[workspace]
resolver = "2"
members = [
  "crates/taskfmt-core",
  "crates/taskfmt",
  "crates/taskfmt-runtime",
  "crates/taskfmt-host",
  "harness",
]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive", "env"] }

[profile.release]
strip = true
lto = "thin"
