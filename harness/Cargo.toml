[package]
name = "taskfmt-harness"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
description = "Integration tests and Docker assets for the taskfmt workspace"
license = "Apache-2.0"
publish = false

[lib]
name = "taskfmt_harness"
path = "src/lib.rs"

# Docker integration checks own their reporting. libtest cannot represent a runtime SKIP: a
# returning test is reported PASS, which would let an unavailable Docker daemon look covered.
[[test]]
name = "docker_itest"
path = "tests/docker_itest.rs"
harness = false

[dependencies]
taskfmt = { package = "taskfmt-core", path = "../crates/taskfmt-core" }
taskfmt-bin = { package = "taskfmt", path = "../crates/taskfmt" }
taskfmt-host = { path = "../crates/taskfmt-host" }
taskfmt-runtime = { path = "../crates/taskfmt-runtime" }
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "1.1.5"
walkdir = "2"
