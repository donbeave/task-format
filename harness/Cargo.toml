[package]
name = "taskfmt"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "task-format harness: task lint, progress init, completion gate, container dispatch"
license = "Apache-2.0"

[lib]
name = "taskfmt"
path = "src/lib.rs"

[[bin]]
name = "taskfmt"
path = "src/main.rs"

# Declared with an explicit `path` OUTSIDE `tests/`: this suite drives the dispatch-time
# fingerprint check, and the build stage that produces the image never receives `checks/`, so
# nothing here is part of the hash input set the fingerprint covers.
[[test]]
name = "fingerprint_cli"
path = "checks/fingerprint_cli.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.3"
tempfile = "3"
toml = "0.9"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"

# The build script hashes the crate's sources with the same `sha2` the library uses; the digest is
# neither hand-rolled nor shelled out to a host `sha256sum`.
[build-dependencies]
sha2 = "0.10"

[profile.release]
strip = true
lto = "thin"
