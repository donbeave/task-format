[package]
name = "taskfmt"
version = "0.2.0"
edition = "2024"
default-run = "taskfmt-host"
rust-version = "1.98"
description = "task-format harness: task lint, progress init, completion gate, container dispatch"
license = "Apache-2.0"

[lib]
name = "taskfmt"
path = "src/lib.rs"

[[bin]]
name = "taskfmt"
path = "src/bin/taskfmt.rs"

[[bin]]
name = "taskfmt-host"
path = "src/bin/taskfmt-host.rs"

# Docker integration checks own their reporting. libtest cannot represent a runtime SKIP: a
# returning test is reported PASS, which would let an unavailable Docker daemon look covered.
[[test]]
name = "docker_itest"
path = "tests/docker_itest.rs"
harness = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
signal-hook = "0.4.4"
tempfile = "3"
toml = "1.1.5"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"

[profile.release]
strip = true
lto = "thin"
