[package]
name = "taskfmt"
version = "0.2.0"
edition = "2024"
default-run = "taskfmt"
rust-version = "1.98"
description = "task-format harness: task lint, progress init, completion gate, container dispatch"
license = "Apache-2.0"

[lib]
name = "taskfmt"
path = "src/lib.rs"

[[bin]]
name = "taskfmt"
path = "src/main.rs"

# Declared with an explicit `path` OUTSIDE `tests/`: this suite drives the dispatch-time
# fingerprint check, and the build stage that produces the image never receives `checks/`, so
# nothing here is part of the hash input set the fingerprint covers.
[[test]]
name = "fingerprint_cli"
path = "checks/fingerprint_cli.rs"

# Docker integration checks own their reporting. libtest cannot represent a runtime SKIP: a
# returning test is reported PASS, which would let an unavailable Docker daemon look covered.
[[test]]
name = "docker_itest"
path = "tests/docker_itest.rs"
harness = false

[dependencies]
anyhow = "1"
axum = "0.8.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
signal-hook = "0.4.4"
tempfile = "3"
toml = "1.1.5"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "process", "time", "fs", "io-std", "io-util"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5.3", features = ["util"] }

# The build script hashes the crate's sources with the same `sha2` the library uses; the digest is
# neither hand-rolled nor shelled out to a host `sha256sum`.
[build-dependencies]
sha2 = "0.11"

[profile.release]
strip = true
lto = "thin"
