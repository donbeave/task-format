# verify.toml — declarative inputs for the gate (`taskfmt verify`). Data only.
# Paths are relative to the repository root (the working directory of the gate).
# The scope base is the per-run trusted commit: TASKFMT_BASE env, --base flag, else "baseline".
#
# ORDER MATTERS: in TOML every key after a `[table]` header belongs to that table, so all
# top-level keys come first and the tables close the file. (reference/task-template/verify.toml
# still has them last — the parser rejects that shape instead of silently dropping the scope.)

schema = "verify/v1"
forbidden_paths = ["src/legacy/file.rs"]     # must not be created or modified vs the base commit
required_paths = ["tests/new_test.rs"]       # must exist after the task

# Scope whitelist: every changed file (vs the base commit, plus staged and untracked)
# must match one glob; anything else fails the gate. Bash-style globs; '*' and '**' cross '/'.
allowed_globs = [
  "src/<area>/*",
  "tests/<area>/*",
]

# Commands run from the repo root. Each must exit 0.
[focused]
commands = [
  "<focused test command for AC-001>",
  "<focused test command for AC-002>",
]

[regression]
commands = [
  "<relevant regression suite>",
]

[lint]
commands = [
  "<fmt --check>",
  "<lint>",
]

# regex must NOT match anywhere under `paths` (default: the whole tree).
[[forbidden_patterns]]
regex = '<legacy_symbol>'
paths = ["src", "tests"]

[[forbidden_patterns]]
regex = '#[ignore]'
paths = ["tests"]
