# experiment.toml — the experiment manifest (schema experiment/v1).
# Read by every `taskfmt` command that touches the repo layout, images, or agent profiles.
# Secrets appear here only as references — `file://NAME` for a local 0600 credential file lying
# directly inside `$HOME/.config/taskfmt/`, `op://…` for 1Password. Both are resolved at dispatch
# time and never written to any committed artifact.

schema = "experiment/v1"

[github]
owner = "donbeave"
repo_prefix = "taskfmt-experiment"

[paths]
tasks_dir = "experiments/tasks"
runs_dir = "experiments/runs"
seed_dir = "experiments/fixtures/seed"
template_dir = "reference/task-template"
goal_prompt = "harness/goal-prompt.md"

[images]
taskfmt = "harness-taskfmt:latest"
base = "harness-base:latest"
claude = "harness-claude:latest"
codex = "harness-codex:latest"

[runtime]
memory = "4g"
cpus = 2
pids_limit = 2048
prereq_timeout_s = 180
kill_after_min = 90

[prereq]
image = "postgres:16-alpine"
user = "pgtui"
password = "pgtui"
db = "pgtui"
port = 5432

[agents.default]
profile = "zai-flash"

[agents.profiles.zai-flash]
kind = "claude"
model = "glm-5.3-flash"
effort = "low"
image = "harness-claude:latest"

[agents.profiles.zai-flash.env_static]
ANTHROPIC_BASE_URL = "https://api.z.ai/api/anthropic"
ANTHROPIC_DEFAULT_OPUS_MODEL = "glm-5.3-flash"
ANTHROPIC_DEFAULT_SONNET_MODEL = "glm-5.3-flash"
ANTHROPIC_DEFAULT_HAIKU_MODEL = "glm-5.3-flash"
API_TIMEOUT_MS = "3000000"
CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC = "1"

[agents.profiles.zai-flash.env_secret]
# Local reference for the Z.ai API key (as used by the operator's claude-zai-flash-yolo). The
# value lives in `$HOME/.config/taskfmt/zai-flash.token`, mode 0600, outside every repository, so
# resolution needs no subprocess and cannot stall an unattended chain behind a locked desktop app.
# The reference is a bare NAME on purpose: rotation stays free forever — replace the file's bytes
# and nothing here changes — whereas an absolute path would be pinned permanently from Phase 2 on.
ANTHROPIC_AUTH_TOKEN = "file://zai-flash.token"

[agents.profiles.codex-default]
kind = "codex"
model = ""
effort = "high"
image = "harness-codex:latest"
